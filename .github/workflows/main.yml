name: Test UTC Time Script

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytz

    - name: Run UTC Time Script
      run: python get_utc_time.py

    - name: Display Script Output
      run: |
        echo "=== UTC Time Script Test Results ==="
        python get_utc_time.py
        echo "=== Test Completed Successfully ==="
